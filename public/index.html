<body>

  </header>

  <main>
    <section class="hero">
      <h1 data-i18n-html="heroTitle"></h1>
      <p data-i18n-html="heroText"></p>
    </section>

    <section class="card converter" data-i18n-attr="aria-label:converterLabel">
      <div class="tabs" role="tablist">
        <button role="tab" class="tab active" aria-selected="true" data-tab="upload" id="tab-upload" data-i18n="tabUpload"></button>
        <button role="tab" class="tab" aria-selected="false" data-tab="link" id="tab-link" data-i18n="tabLink"></button>
      </div>

      <form id="form" novalidate>
        <div class="panel" data-panel="upload">
          <label class="drop" id="drop">
            <input type="file" id="file" accept="image/gif,image/png,image/jpeg,video/mp4,video/webm" hidden />
            <span class="drop-icon" aria-hidden="true">⬆</span>
            <span class="drop-title" data-i18n-html="dropTitle"></span>
            <span class="drop-sub" data-i18n="dropSub"></span>
            <span class="drop-file" id="dropFile" hidden></span>
          </label>
        </div>

        <div class="panel" data-panel="link" hidden>
          <label class="field">
            <span class="field-label" data-i18n="linkLabel"></span>
            <input type="url" id="url" inputmode="url" autocomplete="off" data-i18n-attr="placeholder:linkPlaceholder" />
          </label>
          <p class="hint" data-i18n-html="linkHint"></p>
        </div>

        <details class="opts">
          <summary data-i18n="settings"></summary>
          <div class="opts-grid">
            <fieldset class="seg">
              <legend data-i18n="layout"></legend>
              <label><input type="radio" name="fit" value="fit" checked /><span data-i18n="fitFit"></span></label>
              <label><input type="radio" name="fit" value="crop" /><span data-i18n="fitCrop"></span></label>
              <label><input type="radio" name="fit" value="stretch" /><span data-i18n="fitStretch"></span></label>
            </fieldset>
            <label class="field small">
              <span class="field-label" data-i18n="startSec"></span>
              <input type="number" id="start" min="0" step="0.1" value="0" />
            </label>
          </div>
          <p class="hint" data-i18n="settingsHint"></p>
        </details>

        <button class="btn primary big" id="convertBtn" type="submit">
          <span class="btn-label" data-i18n="prepare"></span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="card result" id="result" hidden aria-live="polite">
      <div class="result-grid">
        <div class="preview-wrap">
          <div class="checker"><img id="previewImg" data-i18n-attr="alt:previewAlt" width="512" height="512" /></div>
          <div class="chat" aria-hidden="true">
            <div class="bubble-sticker"><img id="chatImg" alt="" /></div>
            <span class="chat-time" data-i18n="chatNow"></span>
          </div>
        </div>
        <div class="result-info">
          <h2 data-i18n="ready"></h2>
          <ul class="stats" id="stats"></ul>

          <button class="btn whatsapp big" id="sendBtn" type="button" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>
            <span data-i18n="send"></span>
          </button>
          <a class="btn primary big" id="gifDownloadBtn" download hidden data-i18n="downloadGif"></a>

          <ol class="steps" id="steps"></ol>

          <details class="more">
            <summary data-i18n="more"></summary>
            <p class="hint" data-i18n="moreHint"></p>
            <button class="btn ghost small" id="webpBtn" type="button"></button>
          </details>
        </div>
      </div>
    </section>
