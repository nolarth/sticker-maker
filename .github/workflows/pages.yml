name: GitHub Pages'e yayınla

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # Yalnızca varsayılan daldan yayınla
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Sürüm etiketi (önbellek kırma)
        run: |
          V="${GITHUB_SHA::7}"
          grep -rl "__V__" public --include='*.html' --include='*.js' | xargs sed -i "s/__V__/$V/g"
          grep -rn "?v=" public --include='*.html' --include='*.js' | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
